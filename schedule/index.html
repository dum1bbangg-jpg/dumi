<!doctype html>
<html lang="ko">
<head>
<script>if(location.search.indexOf('embed')>-1)document.documentElement.classList.add('embed');</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=940" />
<title>두미 · 일정</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#4a3a30; --paper:#fbf6ee; --grid:#ece1d0; --c-card:#f8d6e6; --t-card:#efb6d2; --accent:#ff8fb0; --accent-deep:#e36f95; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Gaegu',system-ui,sans-serif;color:var(--ink);background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;-webkit-font-smoothing:antialiased;padding:0 22px 70px;line-height:1.45;min-height:100vh;}
  .diary{max-width:940px;margin:0 auto;}

  /* 인트로 로딩 오버레이 + 콘텐츠 등장 */
  html.embed #page-loader{display:none!important;}
  html.embed .diary{opacity:1!important;animation:none!important;}
  #page-loader{position:fixed;inset:0;z-index:9999;background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease;}
  #page-loader.hide{opacity:0;pointer-events:none;}
  .pl-emoji{font-size:3rem;animation:plPop 1s ease-in-out infinite;}
  .pl-dots{display:flex;gap:9px;}
  .pl-dots span{width:11px;height:11px;border-radius:50%;background:var(--accent);display:block;animation:plDot .85s ease-in-out infinite;}
  .pl-dots span:nth-child(2){animation-delay:.14s;} .pl-dots span:nth-child(3){animation-delay:.28s;}
  @keyframes plPop{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-13px) scale(1.08);}}
  @keyframes plDot{0%,100%{opacity:.35;transform:translateY(0);}50%{opacity:1;transform:translateY(-7px);}}
  .diary{opacity:0;}
  body.ready .diary{opacity:1;animation:pageReveal .6s cubic-bezier(.2,.7,.3,1);}
  @keyframes pageReveal{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}

  nav.tabs{display:flex;justify-content:center;gap:8px;padding:20px 0 8px;position:sticky;top:0;z-index:30;background:transparent;}
  nav.tabs a{font-weight:700;font-size:1.68rem;text-decoration:none;color:var(--ink);padding:6px 26px 8px;border:2.4px solid var(--ink);border-radius:16px;background:#fff;box-shadow:3px 3px 0 rgba(74,58,48,.16);transform:rotate(-1.5deg);transition:transform .15s;}
  nav.tabs a:nth-child(2){transform:rotate(1deg);} nav.tabs a:nth-child(3){transform:rotate(-.5deg);} nav.tabs a:nth-child(4){transform:rotate(.7deg);}
  nav.tabs a:hover{transform:translateY(-2px) rotate(0);}
  nav.tabs a.active{background:var(--t-card);}
  body.embed nav.tabs{display:none;}

  header.hero{margin:10px 4px 22px;}
  .hero .title{font-weight:700;font-size:3rem;line-height:1;margin:0;}
  .hero .sub{font-size:1.3rem;opacity:.6;margin-top:4px;}

  /* 달력 */
  .cal-wrap{background:#fff;border:2.6px solid var(--ink);border-radius:22px;box-shadow:6px 7px 0 rgba(74,58,48,.13);padding:18px 18px 20px;margin-bottom:32px;}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px;}
  .cal-nav{font-family:inherit;font-weight:700;font-size:1.5rem;cursor:pointer;color:var(--ink);background:#fff;border:2.4px solid var(--ink);border-radius:12px;width:42px;height:42px;box-shadow:2px 2px 0 rgba(74,58,48,.15);transition:transform .12s;line-height:1;}
  .cal-nav:hover{transform:translateY(-2px);}
  .cal-label{font-size:1.9rem;font-weight:700;min-width:175px;text-align:center;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px;}
  .cal-wd{text-align:center;font-size:1.15rem;font-weight:700;color:#4a3a3088;padding:3px 0;}
  .cal-wd.sun{color:var(--accent-deep);} .cal-wd.sat{color:#5f8fd6;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
  .cal-cell{min-height:94px;border:2px solid #ece1d0;border-radius:13px;padding:6px;background:#fdfaf5;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:transform .12s,border-color .12s;}
  .cal-cell.empty{border:none;background:transparent;}
  .cal-cell.has-ev{cursor:pointer;border-color:var(--t-card);background:#fff;}
  .cal-cell.has-ev:hover{border-color:var(--accent);transform:translateY(-2px);}
  .cal-cell.today{background:#ffe9f1;border-color:var(--accent);}
  .cal-daynum{font-size:1.18rem;font-weight:700;line-height:1;}
  .cal-daynum.sun{color:var(--accent-deep);} .cal-daynum.sat{color:#5f8fd6;}
  .cal-cell.today .cal-daynum{color:var(--accent-deep);}
  .cal-ev{font-size:0.86rem;background:var(--c-card);border-radius:7px;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--ink);line-height:1.25;}
  .cal-ev.special{background:#efdcff;color:#8a5fb0;}
  .cal-more{font-size:0.82rem;color:#4a3a3099;padding-left:5px;font-weight:700;}

  /* 다가오는 일정 */
  .sch-section{margin-bottom:30px;}
  .sch-section-title{font-size:1.7rem;font-weight:700;margin:0 4px 14px;display:flex;align-items:center;gap:8px;}
  .sch-section-title .cnt{font-size:1.1rem;color:var(--accent-deep);background:#fff;border:2.2px solid var(--accent);border-radius:13px;padding:1px 12px;font-weight:700;}
  .event-card{display:flex;background:#fff;border:2.6px solid var(--ink);border-radius:18px;box-shadow:5px 6px 0 rgba(74,58,48,.13);margin-bottom:14px;overflow:hidden;transform:rotate(-0.4deg);}
  .event-card:nth-child(even){transform:rotate(0.4deg);}
  .event-card.is-today{border-color:var(--accent);box-shadow:5px 6px 0 rgba(227,111,149,.22);}
  .event-date-block{flex-shrink:0;width:112px;background:var(--c-card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 8px;border-right:2.6px dashed var(--ink);}
  .event-card.is-today .event-date-block{background:#ffd9e6;}
  .ev-month{font-size:1rem;font-weight:700;color:var(--accent-deep);letter-spacing:1.5px;}
  .ev-day-num{font-size:2.7rem;font-weight:700;line-height:1;color:var(--ink);}
  .ev-weekday{font-size:1.05rem;color:#4a3a3099;}
  .event-info{flex:1;padding:15px 20px;display:flex;flex-direction:column;justify-content:center;gap:3px;}
  .ev-time{font-size:1.12rem;color:var(--accent-deep);font-weight:700;}
  .ev-title{font-size:1.55rem;font-weight:700;color:var(--ink);}
  .ev-desc{font-size:1.18rem;color:#4a3a3099;}
  .ev-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;}
  .ev-tag{font-size:0.98rem;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:1px 11px;font-weight:700;}
  .ev-tag.special{background:#efdcff;border-color:#b98fe0;color:#8a5fb0;}
  .ev-badge-today{font-size:0.98rem;background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:1px 11px;font-weight:700;}

  .empty-state{text-align:center;padding:30px;color:#4a3a3077;font-size:1.25rem;}
  .empty-state .emoji{font-size:2.2rem;margin-bottom:6px;}

  /* 날짜 모달 */
  .day-modal-bg{position:fixed;inset:0;background:rgba(74,58,48,.32);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;}
  .day-modal-bg.show{display:flex;}
  .day-modal{background:#fff;border:2.6px solid var(--ink);border-radius:22px;box-shadow:7px 8px 0 rgba(74,58,48,.18);width:100%;max-width:430px;max-height:80vh;overflow:auto;padding:22px;}
  .day-modal h3{font-size:1.7rem;font-weight:700;margin-bottom:14px;}
  .day-modal-close{float:right;font-family:inherit;font-weight:700;font-size:1.4rem;cursor:pointer;background:#fff;border:2.2px solid var(--ink);border-radius:10px;width:36px;height:36px;line-height:1;}

  footer{margin:44px 4px 0;text-align:center;font-size:1.15rem;opacity:.55;}
</style>
</head>
<body>
<div id="page-loader"><div class="pl-emoji">📅</div><div class="pl-dots"><span></span><span></span><span></span></div></div>
<div class="diary">

  <nav class="tabs">
    <a href="/">프로필</a>
    <a href="/upbo/" data-nav="upbo">업보</a>
    <a href="/song/" data-nav="song">노래책</a>
    <a href="/schedule/" class="active" data-nav="schedule">일정</a>
  </nav>

  <header class="hero">
    <h1 class="title">일정 📅</h1>
    <div class="sub">두미 방송 일정이에요! 함께해요 ♡</div>
  </header>

  <div class="cal-wrap">
    <div class="cal-head">
      <button class="cal-nav" onclick="calNav(-1)">‹</button>
      <div class="cal-label" id="calLabel">—</div>
      <button class="cal-nav" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-weekdays">
      <div class="cal-wd sun">일</div><div class="cal-wd">월</div><div class="cal-wd">화</div><div class="cal-wd">수</div><div class="cal-wd">목</div><div class="cal-wd">금</div><div class="cal-wd sat">토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <section class="sch-section">
    <div class="sch-section-title">🌸 다가오는 일정 <span class="cnt" id="upcomingCnt"></span></div>
    <div id="upcomingList"><div class="empty-state"><div class="emoji">⏳</div><p>불러오는 중...</p></div></div>
  </section>

  <footer>
    <p>© 2026 두미 · 두콩이들 💗</p>
  </footer>
</div>

<div class="day-modal-bg" id="dayModal">
  <div class="day-modal">
    <button class="day-modal-close" onclick="closeDayModal()">×</button>
    <h3 id="dayModalTitle"></h3>
    <div id="dayModalBody"></div>
  </div>
</div>

<script src="../js/supabase-config.js"></script>
<script src="../js/nav.js"></script>
<script>
  const WEEKDAYS = ['일','월','화','수','목','금','토'];
  const MONTHS_EN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  let calYear, calMonth, allEvents = [], evMap = {};

  function esc(t){ const d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }
  function pad(n){ return String(n).padStart(2,'0'); }
  function isToday(dateStr){ const t=new Date(), d=new Date(dateStr+'T00:00:00'); return t.getFullYear()===d.getFullYear()&&t.getMonth()===d.getMonth()&&t.getDate()===d.getDate(); }

  async function loadSchedule(){
    try{
      const sb = initSupabase();
      const { data, error } = await sb.from('schedule_events').select('*')
        .eq('is_hidden', false).order('date', { ascending:true }).order('time', { ascending:true });
      if(error) throw error;
      allEvents = data || [];
      evMap = {};
      allEvents.forEach(ev => { (evMap[ev.date] = evMap[ev.date]||[]).push(ev); });
      const now = new Date();
      calYear = now.getFullYear(); calMonth = now.getMonth();
      renderCalendar();
      renderUpcoming();
    }catch(err){
      console.error(err);
      document.getElementById('calGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:#4a3a3077">달력을 불러오지 못했어요</div>';
      document.getElementById('upcomingList').innerHTML = '';
    }
  }

  function renderCalendar(){
    const first = new Date(calYear, calMonth, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    const todayStr = new Date().toISOString().slice(0,10);
    document.getElementById('calLabel').textContent = `${calYear}년 ${calMonth+1}월`;

    let html = '';
    for(let i=0;i<startDow;i++) html += '<div class="cal-cell empty"></div>';
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
      const evs = evMap[dateStr] || [];
      const dow = (startDow + d - 1) % 7;
      const today = dateStr === todayStr;
      const shown = evs.slice(0,2).map(ev =>
        `<div class="cal-ev${ev.is_special?' special':''}">${ev.time?esc(ev.time.slice(0,5))+' ':''}${esc(ev.title)}</div>`
      ).join('');
      const more = evs.length>2 ? `<div class="cal-more">+${evs.length-2}</div>` : '';
      const cls = `cal-cell${today?' today':''}${evs.length?' has-ev':''}`;
      const click = evs.length ? ` onclick="showDay('${dateStr}')"` : '';
      html += `<div class="${cls}"${click}>
        <div class="cal-daynum${dow===0?' sun':''}${dow===6?' sat':''}">${d}</div>
        ${shown}${more}
      </div>`;
    }
    document.getElementById('calGrid').innerHTML = html;
  }

  function calNav(delta){
    calMonth += delta;
    if(calMonth<0){ calMonth=11; calYear--; }
    else if(calMonth>11){ calMonth=0; calYear++; }
    renderCalendar();
  }

  function showDay(dateStr){
    const evs = evMap[dateStr] || [];
    if(!evs.length) return;
    const d = new Date(dateStr+'T00:00:00');
    document.getElementById('dayModalTitle').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
    document.getElementById('dayModalBody').innerHTML = evs.map(ev => `
      <div style="border:2.2px solid var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:10px;${ev.is_special?'background:#f7efff;border-color:#b98fe0;':'background:#fff;'}">
        ${ev.time?`<div style="font-size:1.05rem;color:var(--accent-deep);font-weight:700">🕒 ${esc(ev.time.slice(0,5))}</div>`:''}
        <div style="font-size:1.4rem;font-weight:700">${esc(ev.title)}</div>
        ${ev.description?`<div style="font-size:1.1rem;color:#4a3a3099;margin-top:2px">${esc(ev.description)}</div>`:''}
        ${(ev.tags&&ev.tags.length)?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">${ev.tags.map(t=>`<span style="font-size:0.9rem;border:2px solid var(--ink);border-radius:10px;padding:0 9px;font-weight:700">${esc(t)}</span>`).join('')}</div>`:''}
      </div>`).join('');
    document.getElementById('dayModal').classList.add('show');
  }
  function closeDayModal(){ document.getElementById('dayModal').classList.remove('show'); }

  function eventCard(ev){
    const d = new Date(ev.date+'T00:00:00');
    const today = isToday(ev.date);
    const tags = (ev.tags||[]).map((tag,i)=>`<span class="ev-tag${i===0&&ev.is_special?' special':''}">${esc(tag)}</span>`).join('');
    const todayBadge = today ? `<span class="ev-badge-today">오늘</span>` : '';
    return `<div class="event-card${today?' is-today':''}">
      <div class="event-date-block">
        <div class="ev-month">${MONTHS_EN[d.getMonth()]}</div>
        <div class="ev-day-num">${d.getDate()}</div>
        <div class="ev-weekday">${WEEKDAYS[d.getDay()]}요일</div>
      </div>
      <div class="event-info">
        ${ev.time ? `<div class="ev-time">🕒 ${esc(ev.time.slice(0,5))}</div>` : ''}
        <div class="ev-title">${esc(ev.title)}</div>
        ${ev.description ? `<div class="ev-desc">${esc(ev.description)}</div>` : ''}
        ${(tags||todayBadge) ? `<div class="ev-tags">${tags}${todayBadge}</div>` : ''}
      </div>
    </div>`;
  }

  function renderUpcoming(){
    const el = document.getElementById('upcomingList');
    const today = new Date().toISOString().slice(0,10);
    const up = allEvents.filter(ev => ev.date >= today).slice(0,6);
    document.getElementById('upcomingCnt').textContent = up.length ? up.length+'개' : '';
    el.innerHTML = up.length
      ? up.map(eventCard).join('')
      : `<div class="empty-state"><div class="emoji">📭</div><p>다가오는 일정이 없어요</p></div>`;
  }

  document.getElementById('dayModal').addEventListener('click', e => { if(e.target.id==='dayModal') closeDayModal(); });
  if(new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
  loadSchedule();
</script>
</body>
</html>
