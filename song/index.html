<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=940" />
<title>두미 · 노래책</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#4a3a30; --paper:#fbf6ee; --grid:#ece1d0; --c-card:#f8d6e6; --t-card:#efb6d2; --accent:#ff8fb0; --accent-deep:#e36f95; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Gaegu',system-ui,sans-serif;color:var(--ink);background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;-webkit-font-smoothing:antialiased;padding:0 22px 70px;line-height:1.45;min-height:100vh;}
  .diary{max-width:940px;margin:0 auto;}

  nav.tabs{display:flex;justify-content:center;gap:8px;padding:20px 0 8px;position:sticky;top:0;z-index:30;background:linear-gradient(var(--paper) 80%,transparent);}
  nav.tabs a{font-weight:700;font-size:1.68rem;text-decoration:none;color:var(--ink);padding:6px 26px 8px;border:2.4px solid var(--ink);border-radius:16px;background:#fff;box-shadow:3px 3px 0 rgba(74,58,48,.16);transform:rotate(-1.5deg);transition:transform .15s;}
  nav.tabs a:nth-child(2){transform:rotate(1deg);} nav.tabs a:nth-child(3){transform:rotate(-.5deg);}
  nav.tabs a:hover{transform:translateY(-2px) rotate(0);}
  nav.tabs a.active{background:var(--t-card);}

  header.hero{margin:10px 4px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .hero .title{font-weight:700;font-size:3rem;line-height:1;margin:0;}
  .hero .sub{font-size:1.3rem;opacity:.6;margin-top:4px;}
  .hero-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .count-badge{font-size:1.15rem;color:var(--accent-deep);background:#fff;border:2.4px solid var(--accent);padding:3px 14px;border-radius:15px;font-weight:700;white-space:nowrap;}
  .rand-btn{font-family:inherit;font-weight:700;font-size:1.12rem;cursor:pointer;color:#fff;background:var(--accent);border:2.4px solid var(--ink);padding:4px 16px 6px;border-radius:15px;box-shadow:2px 2px 0 rgba(74,58,48,.16);transition:transform .15s;}
  .rand-btn:hover{transform:translateY(-2px);}

  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .search-wrap{position:relative;flex:1;min-width:220px;}
  .search-input{width:100%;padding:12px 16px 12px 44px;border-radius:16px;border:2.6px solid var(--ink);background:#fff;font-family:inherit;font-size:1.2rem;color:var(--ink);outline:none;box-shadow:3px 3px 0 rgba(74,58,48,.12);}
  .search-input::placeholder{color:#4a3a3066;}
  .search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:1.1rem;pointer-events:none;}
  .filter-tabs{display:flex;gap:7px;flex-wrap:wrap;}
  .filter-tab{font-family:inherit;font-size:1.08rem;font-weight:700;padding:5px 16px 7px;border-radius:14px;border:2.4px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;transition:transform .12s;box-shadow:2px 2px 0 rgba(74,58,48,.12);}
  .filter-tab:hover{transform:translateY(-1px);}
  .filter-tab.active{background:var(--accent);color:#fff;}

  .table-box{position:relative;border-radius:20px;background:#fff;box-shadow:6px 7px 0 rgba(74,58,48,.13);overflow:hidden;}
  .table-box::before{content:'';position:absolute;inset:0;border:2.6px solid var(--ink);border-radius:20px;filter:url(#wob);pointer-events:none;z-index:3;}
  table{width:100%;border-collapse:collapse;font-size:1.18rem;position:relative;z-index:2;}
  thead{background:var(--c-card);}
  thead th{padding:13px 16px;text-align:left;font-size:1.05rem;font-weight:700;color:var(--ink);}
  thead th.center{text-align:center;}
  tbody tr{border-top:2px dashed #4a3a3030;transition:background .15s;}
  tbody tr:hover{background:#fdf0f6;}
  tbody td{padding:12px 16px;color:var(--ink);vertical-align:middle;}
  tbody td.center{text-align:center;}
  .artist-cell{font-weight:700;color:#4a3a3099;font-size:1.08rem;}
  .title-cell{font-weight:700;}
  .memo-cell{font-size:1rem;color:#4a3a3088;}
  .stars{display:inline-flex;gap:2px;}
  .star{font-size:1.15rem;} .star-on{color:var(--accent);} .star-off{color:#e3d6c8;}
  .genre-badge{font-size:.95rem;padding:2px 11px;border-radius:14px;font-weight:700;display:inline-block;border:1.5px solid var(--ink);}
  .genre-kpop{background:#fbe0ec;} .genre-jpop{background:#fbe9cf;} .genre-pop{background:#e6def5;}
  .genre-etc{background:#efe5d8;}
  .copy-btn{font-family:inherit;background:#fff;border:2px solid var(--ink);border-radius:11px;padding:4px 12px;font-size:1rem;font-weight:700;color:var(--ink);cursor:pointer;transition:transform .12s;}
  .copy-btn:hover{transform:translateY(-1px);}
  .copy-btn.copied{background:var(--accent);color:#fff;}

  .state-box{text-align:center;padding:60px 20px;position:relative;z-index:2;}
  .spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--c-card);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .state-text{font-size:1.2rem;color:#4a3a3099;} .state-emoji{font-size:2.4rem;margin-bottom:10px;}

  .pagination{display:flex;align-items:center;justify-content:center;gap:5px;padding:24px 0 8px;flex-wrap:wrap;}
  .page-btn{min-width:38px;height:38px;padding:0 8px;border-radius:11px;border:2.2px solid var(--ink);background:#fff;color:var(--ink);font-family:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;transition:transform .12s;display:flex;align-items:center;justify-content:center;}
  .page-btn:hover{transform:translateY(-1px);}
  .page-btn.active{background:var(--accent);color:#fff;}
  .page-btn:disabled{opacity:.35;cursor:default;pointer-events:none;}

  footer{margin:44px 4px 0;text-align:center;font-size:1.15rem;opacity:.55;}
  body.embed nav.tabs{display:none;}
  @media (max-width:600px){.memo-cell{display:none;}.hero .title{font-size:2.4rem;}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<main class="diary">
  <nav class="tabs">
    <a href="/">프로필</a>
    <a href="/upbo/">업보</a>
    <a href="/song/" class="active">노래책</a>
  </nav>

  <header class="hero">
    <div>
      <h1 class="title">노래책 🎵</h1>
      <div class="sub">신청하고 싶은 노래를 찾아보세요</div>
    </div>
    <div class="hero-right">
      <button class="rand-btn" onclick="songbookRandom()">🎲 랜덤</button>
      <span class="count-badge" id="count-badge">— 곡</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="search-input" placeholder="가수 또는 제목 검색...">
    </div>
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-genre="all">전체</button>
      <button class="filter-tab" data-genre="kpop">Kpop</button>
      <button class="filter-tab" data-genre="jpop">Jpop</button>
      <button class="filter-tab" data-genre="pop">Pop</button>
      <button class="filter-tab" data-genre="etc">기타</button>
    </div>
  </div>

  <div class="table-box">
    <table>
      <thead><tr>
        <th style="width:20%">가수</th><th style="width:30%">제목</th>
        <th style="width:11%" class="center">장르</th><th style="width:13%" class="center">숙련도</th>
        <th style="width:18%">메모</th><th style="width:8%" class="center">복사</th>
      </tr></thead>
      <tbody id="song-tbody"></tbody>
    </table>
    <div id="loading-state" class="state-box"><div class="spinner"></div><p class="state-text">불러오는 중...</p></div>
    <div id="empty-state" class="state-box" style="display:none"><div class="state-emoji">🎵</div><p class="state-text">등록된 노래가 없어요</p></div>
    <div id="no-result-state" class="state-box" style="display:none"><div class="state-emoji">🔍</div><p class="state-text">검색 결과가 없어요</p></div>
  </div>
  <div class="pagination" id="pagination"></div>

  <footer>
    <p>© 2026 두미 · 두콩이들 💗</p>
    <p>Designed &amp; Developed by 아키텍트 크리에이티브 · profile@soop.info</p>
  </footer>
</main>

<script src="../js/supabase-config.js"></script>
<script>
  const sb = initSupabase();
  const GENRE_LABELS = { kpop:'Kpop', jpop:'Jpop', pop:'Pop', etc:'기타' };
  let allSongs = [], currentGenre = 'all', currentSearch = '';
  const PAGE_SIZE = 30;
  let currentPage = 1;

  function esc(t){ const d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }

  async function loadSongs(){
    try{
      const { data, error } = await sb.from('songs').select('*').order('sort_order', { ascending:true }).order('artist', { ascending:true });
      document.getElementById('loading-state').style.display = 'none';
      if(error) throw error;
      allSongs = data || [];
      render();
    }catch(e){
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
    }
  }
  function genreClass(g){ const map={kpop:'genre-kpop',jpop:'genre-jpop',pop:'genre-pop'}; return map[g]||'genre-etc'; }
  function starsHTML(n){ const c=Math.min(Math.max(parseInt(n)||0,0),5); let s='<span class="stars">'; for(let i=1;i<=5;i++) s+=`<span class="star ${i<=c?'star-on':'star-off'}">${i<=c?'★':'☆'}</span>`; return s+'</span>'; }

  function render(){
    const q = currentSearch.trim().toLowerCase();
    const filtered = allSongs.filter(s => {
      const genreOk = currentGenre==='all' || s.genre===currentGenre;
      const searchOk = !q || (s.artist||'').toLowerCase().includes(q) || (s.title||'').toLowerCase().includes(q);
      return genreOk && searchOk;
    });
    const tbody = document.getElementById('song-tbody');
    const emptyEl = document.getElementById('empty-state');
    const noResEl = document.getElementById('no-result-state');
    document.getElementById('count-badge').textContent = `${allSongs.length} 곡`;
    if(allSongs.length===0){ emptyEl.style.display='block'; noResEl.style.display='none'; tbody.innerHTML=''; renderPagination(0); return; }
    emptyEl.style.display='none';
    if(filtered.length===0){ noResEl.style.display='block'; tbody.innerHTML=''; renderPagination(0); return; }
    noResEl.style.display='none';
    const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    if(currentPage>totalPages) currentPage=1;
    const start=(currentPage-1)*PAGE_SIZE;
    const paged = filtered.slice(start, start+PAGE_SIZE);
    renderPagination(totalPages);
    tbody.innerHTML = paged.map(s => `
      <tr>
        <td class="artist-cell">${esc(s.artist)||'—'}</td>
        <td class="title-cell">${esc(s.title)||'—'}</td>
        <td class="center"><span class="genre-badge ${genreClass(s.genre)}">${GENRE_LABELS[s.genre]||s.genre||'기타'}</span></td>
        <td class="center">${starsHTML(s.level)}</td>
        <td class="memo-cell">${esc(s.memo)||''}</td>
        <td class="center"><button class="copy-btn" onclick="copyTitle(this, '${(s.artist||'').replace(/'/g,"\\'")} - ${(s.title||'').replace(/'/g,"\\'")}')">복사</button></td>
      </tr>`).join('');
  }
  function renderPagination(totalPages){
    const el = document.getElementById('pagination');
    if(totalPages<=1){ el.innerHTML=''; return; }
    let b = `<button class="page-btn" ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">‹</button>`;
    const delta=2;
    for(let i=1;i<=totalPages;i++){
      if(i===1||i===totalPages||(i>=currentPage-delta&&i<=currentPage+delta)){
        b += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      } else if(i===currentPage-delta-1||i===currentPage+delta+1){ b += `<span style="padding:0 4px;color:#4a3a3066">…</span>`; }
    }
    b += `<button class="page-btn" ${currentPage===totalPages?'disabled':''} onclick="goPage(${currentPage+1})">›</button>`;
    el.innerHTML = b;
  }
  function goPage(n){ currentPage=n; render(); document.querySelector('.table-box')?.scrollIntoView({behavior:'smooth',block:'start'}); }
  function copyTitle(btn, text){ navigator.clipboard.writeText(text).then(()=>{ btn.textContent='✓'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent='복사';btn.classList.remove('copied');},1500); }); }

  document.getElementById('search-input').addEventListener('input', e => { currentSearch=e.target.value; currentPage=1; render(); });
  document.getElementById('filter-tabs').addEventListener('click', e => {
    const tab = e.target.closest('.filter-tab'); if(!tab) return;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active'); currentGenre=tab.dataset.genre; currentPage=1; render();
  });

  function songbookRandom(){
    const q = currentSearch.trim().toLowerCase();
    const visible = allSongs.filter(s => (currentGenre==='all'||s.genre===currentGenre) && (!q || (s.artist||'').toLowerCase().includes(q) || (s.title||'').toLowerCase().includes(q)));
    if(!visible.length) return;
    const song = visible[Math.floor(Math.random()*visible.length)];
    const old = document.getElementById('randModal'); if(old) old.remove();
    const modal = document.createElement('div');
    modal.id='randModal';
    modal.style.cssText='position:fixed;inset:0;background:rgba(74,58,48,.32);backdrop-filter:blur(4px);z-index:999';
    modal.innerHTML = `<div style="background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:2.8px solid var(--ink);border-radius:24px;padding:28px 24px;width:340px;text-align:center;box-shadow:8px 9px 0 rgba(74,58,48,.18);position:fixed;top:320px;left:50%;transform:translateX(-50%)">
        <div style="font-size:2.6rem;margin-bottom:10px">🎲</div>
        <div style="font-size:1.05rem;color:#4a3a3088;margin-bottom:6px">${GENRE_LABELS[song.genre]||song.genre||'기타'}</div>
        <div style="font-size:1.2rem;color:var(--accent-deep);font-weight:700;margin-bottom:4px">${esc(song.artist)||''}</div>
        <div style="font-size:1.7rem;font-weight:700;color:var(--ink);margin-bottom:8px">${esc(song.title)||''}</div>
        <div style="font-size:1.1rem;color:#4a3a3088;margin-bottom:20px">${esc(song.memo)||''}</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button onclick="navigator.clipboard.writeText('${(song.artist||'').replace(/'/g,"\\'")} - ${(song.title||'').replace(/'/g,"\\'")}').then(()=>{document.getElementById('randModal').remove()})" style="font-family:inherit;padding:9px 18px;background:var(--accent);color:#fff;border:2.4px solid var(--ink);border-radius:14px;font-size:1.05rem;font-weight:700;cursor:pointer">복사</button>
          <button onclick="document.getElementById('randModal').remove();songbookRandom()" style="font-family:inherit;padding:9px 18px;background:#fff;color:var(--ink);border:2.4px solid var(--ink);border-radius:14px;font-size:1.05rem;font-weight:700;cursor:pointer">다시</button>
          <button onclick="document.getElementById('randModal').remove()" style="font-family:inherit;padding:9px 16px;background:#fff;color:#4a3a3088;border:2.4px solid var(--ink);border-radius:14px;font-size:1.05rem;cursor:pointer">닫기</button>
        </div></div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if(e.target===modal) modal.remove(); });
  }

  if(new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
  loadSongs();
</script>
</body>
</html>
