<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>두미 · 업보</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#4a3a30; --paper:#fbf6ee; --grid:#ece1d0;
    --c-card:#f6ead0; --t-card:#ecd6a4;
    --accent:#ff8fb0; --accent-deep:#e36f95;
    --pink-soft:#fbe0ec;
    --event:#a87cd6; --event-deep:#7e57b0; --event-bg:rgba(168,124,214,.14);
    --prep:#fb7185;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Gaegu',system-ui,sans-serif;color:var(--ink);background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;-webkit-font-smoothing:antialiased;padding:0 22px 70px;line-height:1.45;min-height:100vh;}
  .diary{max-width:940px;margin:0 auto;}

  nav.tabs{display:flex;justify-content:center;gap:8px;padding:20px 0 8px;position:sticky;top:0;z-index:30;background:linear-gradient(var(--paper) 80%,transparent);}
  nav.tabs a{font-weight:700;font-size:1.2rem;text-decoration:none;color:var(--ink);padding:4px 20px 6px;border:2.4px solid var(--ink);border-radius:16px;background:#fff;box-shadow:3px 3px 0 rgba(74,58,48,.16);transform:rotate(-1.5deg);transition:transform .15s;}
  nav.tabs a:nth-child(2){transform:rotate(1deg);} nav.tabs a:nth-child(3){transform:rotate(-.5deg);}
  nav.tabs a:hover{transform:translateY(-2px) rotate(0);}
  nav.tabs a.active{background:var(--accent);color:#fff;}

  header.hero{margin:10px 4px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .hero .title{font-weight:700;font-size:3rem;line-height:1;margin:0;}
  .hero .sub{font-size:1.3rem;opacity:.6;margin-top:4px;}
  .hero-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .updated-badge{font-size:1.15rem;color:var(--ink);background:#fff;border:2.4px solid var(--ink);padding:3px 14px;border-radius:15px;box-shadow:2px 2px 0 rgba(74,58,48,.14);white-space:nowrap;}
  .inquiry-btn{font-family:inherit;font-weight:700;font-size:1.15rem;cursor:pointer;color:#fff;background:var(--accent);border:2.4px solid var(--ink);padding:4px 18px 6px;border-radius:15px;box-shadow:2px 2px 0 rgba(74,58,48,.16);transition:transform .15s;}
  .inquiry-btn:hover{transform:translateY(-2px);}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 2px 14px;font-size:1.02rem;color:#4a3a30aa;align-items:center;}
  .legend .dot{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-1px;margin-right:5px;border:2px solid var(--ink);}
  .legend .dot.evt{background:var(--event-bg);border-color:var(--event);}
  .legend .dot.prep{background:#fff;border-color:var(--prep);}

  .search-input{width:100%;padding:13px 18px;border-radius:16px;border:2.6px solid var(--ink);background:#fff;font-family:inherit;font-size:1.25rem;color:var(--ink);outline:none;margin-bottom:22px;box-shadow:3px 3px 0 rgba(74,58,48,.12);}
  .search-input::placeholder{color:#4a3a3066;}

  .member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
  .member-card{background:var(--c-card);border-radius:20px;padding:18px 14px 16px;text-align:center;cursor:pointer;
    box-shadow:6px 7px 0 rgba(74,58,48,.13);opacity:0;transform:translateY(12px);transition:transform .2s,box-shadow .2s,opacity .4s;position:relative;}
  .member-card:nth-child(3n){transform:rotate(-1deg) translateY(12px);} .member-card:nth-child(3n+2){transform:rotate(1deg) translateY(12px);}
  .member-card.visible{opacity:1;transform:translateY(0);}
  .member-card.visible:nth-child(3n){transform:rotate(-1deg);} .member-card.visible:nth-child(3n+2){transform:rotate(1deg);}
  .member-card:hover{transform:translateY(-4px) rotate(0)!important;}
  .member-card > *{position:relative;z-index:2;}
  .evt-mark{position:absolute;top:8px;right:10px;font-size:1.1rem;z-index:3;}
  .member-avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,#f0d6b8,#f6c8da);overflow:hidden;border:2.6px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:26px;}
  .member-avatar img{width:100%;height:100%;object-fit:cover;}
  .member-nick{font-size:1.25rem;font-weight:700;color:var(--ink);margin-bottom:2px;line-height:1.25;word-break:break-all;}
  .member-id{font-size:1rem;color:#4a3a3088;margin-bottom:8px;}
  .member-count{display:inline-flex;align-items:center;gap:4px;font-size:1.05rem;font-weight:700;background:var(--pink-soft);color:var(--accent-deep);border:2px solid var(--accent);padding:1px 12px 2px;border-radius:15px;}

  .state-box{text-align:center;padding:60px 20px;color:#4a3a3099;font-size:1.25rem;}
  .spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--t-card);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(74,58,48,.32);backdrop-filter:blur(4px);display:none;}
  .modal-backdrop.open{display:flex;}
  .modal-box{position:fixed;left:50%;transform:translateX(-50%);background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;
    border:2.8px solid var(--ink);border-radius:24px;padding:26px;max-width:440px;width:92%;max-height:80vh;overflow-y:auto;
    box-shadow:8px 9px 0 rgba(74,58,48,.18);animation:popIn .22s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popIn{from{transform:translateX(-50%) translateY(8px) scale(.97);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
  .modal-header{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .modal-avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#f0d6b8,#f6c8da);overflow:hidden;border:2.6px solid var(--ink);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .modal-avatar img{width:100%;height:100%;object-fit:cover;}
  .modal-nick{font-size:1.45rem;font-weight:700;color:var(--ink);}
  .modal-uid{font-size:1.1rem;color:#4a3a3088;}
  .task-list{display:flex;flex-direction:column;gap:9px;}
  .task-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 15px;background:#fff;border:2.2px solid var(--ink);border-radius:14px;}
  .task-row.evt{background:var(--event-bg);border-color:var(--event);}
  .task-row.prep{border-color:var(--prep);box-shadow:0 0 0 2px rgba(251,113,133,.25);}
  .task-name{font-size:1.18rem;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .task-memo-txt{font-size:1rem;color:#4a3a3088;margin-top:1px;}
  .mini-tag{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:10px;border:1.5px solid;}
  .mini-tag.evt{color:var(--event-deep);border-color:var(--event);background:#fff;}
  .mini-tag.prep{color:var(--prep);border-color:var(--prep);background:#fff;}
  .task-qty{font-size:1.1rem;font-weight:700;color:var(--accent-deep);background:var(--pink-soft);border:2px solid var(--accent);padding:1px 12px 2px;border-radius:15px;white-space:nowrap;flex-shrink:0;}
  .modal-close{width:100%;padding:12px;border-radius:15px;background:#fff;color:var(--ink);border:2.6px solid var(--ink);font-family:inherit;font-size:1.18rem;font-weight:700;cursor:pointer;margin-top:18px;box-shadow:3px 3px 0 rgba(74,58,48,.14);transition:transform .12s;}
  .modal-close:hover{transform:translateY(-2px);}
  .modal-input{width:100%;padding:12px 15px;border-radius:14px;border:2.6px solid var(--ink);font-family:inherit;font-size:1.15rem;color:var(--ink);background:#fff;outline:none;margin-bottom:11px;}
  textarea.modal-input{height:104px;resize:none;}
  .modal-submit{width:100%;padding:12px;border-radius:15px;background:var(--accent);color:#fff;border:2.6px solid var(--ink);font-family:inherit;font-size:1.2rem;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 rgba(74,58,48,.16);transition:transform .12s;}
  .modal-submit:hover{transform:translateY(-2px);}

  footer{margin:44px 4px 0;text-align:center;font-size:1.15rem;opacity:.55;}
  body.embed nav.tabs{display:none;}
  @media (max-width:600px){.member-grid{grid-template-columns:repeat(2,1fr);}.hero .title{font-size:2.4rem;}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<main class="diary">
  <nav class="tabs">
    <a href="/">프로필</a>
    <a href="/upbo/" class="active">업보</a>
    <a href="/song/">노래책</a>
  </nav>

  <header class="hero">
    <div>
      <h1 class="title">업보 현황 📖</h1>
      <div class="sub">두콩이들의 업보 모음</div>
    </div>
    <div class="hero-right">
      <span class="updated-badge" id="updatedLabel">갱신일: —</span>
      <button class="inquiry-btn" onclick="openInquiry()">업보 문의</button>
    </div>
  </header>

  <div class="legend">
    <span><span class="dot evt"></span>이벤트 업보</span>
    <span><span class="dot prep"></span>준비완료</span>
    <span style="opacity:.7">· 카드를 누르면 상세 업보가 보여요</span>
  </div>

  <input class="search-input" id="searchInput" type="text" placeholder="🔍 닉네임 또는 아이디 검색...">

  <div id="loadingState" class="state-box"><div class="spinner"></div>불러오는 중...</div>
  <div id="emptyState" class="state-box" style="display:none">아직 업보가 없어요 ✨</div>
  <div class="member-grid" id="memberGrid"></div>
</main>

<div class="modal-backdrop" id="upboModal" onclick="closeUpboModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-avatar" id="modal-avatar"><span>🐱</span></div>
      <div><div class="modal-nick" id="modal-nick"></div><div class="modal-uid" id="modal-uid"></div></div>
    </div>
    <div class="task-list" id="modal-task-list"></div>
    <button class="modal-close" onclick="document.getElementById('upboModal').classList.remove('open'); document.querySelector('#upboModal .modal-box').style.top = ''">닫기</button>
  </div>
</div>

<div class="modal-backdrop" id="inquiryModal" onclick="closeInquiry(event)">
  <div class="modal-box" onclick="event.stopPropagation()" style="top:50%;transform:translate(-50%,-50%)">
    <div style="font-size:1.45rem;font-weight:700;margin-bottom:16px">업보 문의 ✏️</div>
    <div id="inquiryForm">
      <input class="modal-input" id="iNick" type="text" placeholder="닉네임">
      <textarea class="modal-input" id="iContent" placeholder="문의 내용을 입력해주세요"></textarea>
      <button class="modal-submit" onclick="submitInquiry()">문의 접수</button>
    </div>
    <div id="inquirySuccess" style="display:none;text-align:center;padding:20px">
      <div style="font-size:2.8rem;margin-bottom:10px">✅</div>
      <div style="font-weight:700;color:var(--ink)">문의가 접수됐어요!</div>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 두미 · 두콩이들 💗</p>
  <p>Designed &amp; Developed by 아키텍트 크리에이티브 · profile@soop.info</p>
</footer>

<script src="../js/supabase-config.js"></script>
<script>
const sb = initSupabase();
let allMembers = [], memberTasks = {};

function esc(t){ const d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }
function avatarUrl(uid){ if(!uid) return null; const pre=uid.substring(0,2); return `https://profile.img.sooplive.com/LOGO/${pre}/${uid}/${uid}.jpg`; }
function hasEvent(tasks){ return tasks.some(t => t.upbo_task_types?.category === 'event'); }

async function load(){
  try{
    const [{ data: settings }, { data: members }, { data: tasks }] = await Promise.all([
      sb.from('upbo_settings').select('*').eq('key','last_updated').maybeSingle(),
      sb.from('upbo_members').select('*').order('sort_order').order('nickname'),
      sb.from('upbo_tasks').select('*, upbo_task_types(id,name,category,sort_order)').gt('quantity', 0)
    ]);
    if(settings?.value) document.getElementById('updatedLabel').textContent = '갱신일: ' + settings.value;
    memberTasks = {};
    (tasks||[]).forEach(t => { (memberTasks[t.member_id] = memberTasks[t.member_id] || []).push(t); });
    allMembers = (members||[]).filter(m => (memberTasks[m.id]?.length) && !m.is_hidden);
    document.getElementById('loadingState').style.display = 'none';
    if(!allMembers.length){ document.getElementById('emptyState').style.display='block'; return; }
    render(allMembers);
  }catch(e){
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
  }
}

function render(members){
  const grid = document.getElementById('memberGrid');
  const empty = document.getElementById('emptyState');
  if(!members.length){ empty.style.display='block'; grid.innerHTML=''; return; }
  empty.style.display = 'none';
  grid.innerHTML = members.map((m) => {
    const tasks = memberTasks[m.id] || [];
    const totalQty = tasks.reduce((s,t) => s + (t.quantity||1), 0);
    const url = avatarUrl(m.user_id);
    const imgHtml = url ? `<img src="${url}" alt="${esc(m.nickname)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : '';
    const fallback = `<span style="${url?'display:none':''}">🐱</span>`;
    const evt = hasEvent(tasks) ? '<span class="evt-mark" title="이벤트 업보 있음">🟣</span>' : '';
    return `<div class="member-card" onclick="openUpboModal('${m.id}', event)">
      ${evt}
      <div class="member-avatar">${imgHtml}${fallback}</div>
      <div class="member-nick">${esc(m.nickname)}</div>
      ${m.user_id ? `<div class="member-id">(${esc(m.user_id)})</div>` : ''}
      <span class="member-count">업보 ${totalQty}</span>
    </div>`;
  }).join('');
  const obs = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); }), {threshold:.05});
  grid.querySelectorAll('.member-card').forEach(el => obs.observe(el));
}

document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  render(q ? allMembers.filter(m => m.nickname.toLowerCase().includes(q) || (m.user_id||'').toLowerCase().includes(q)) : allMembers);
});

function openUpboModal(memberId, clickEvent){
  const card = clickEvent?.currentTarget;
  const modal = document.querySelector('#upboModal .modal-box');
  if(card && modal){
    const rect = card.getBoundingClientRect();
    const centerY = rect.top + rect.height / 2;
    const vh = window.innerHeight;
    const mh = Math.min(modal.offsetHeight || 400, vh * 0.8);
    let top = centerY - mh / 2;
    top = Math.max(16, Math.min(top, vh - mh - 16));
    modal.style.top = top + 'px';
  }
  const m = allMembers.find(x => String(x.id) === String(memberId));
  if(!m) return;
  const tasks = (memberTasks[memberId] || []).slice().sort((a, b) => {
    const na = a.upbo_task_types?.name || '', nb = b.upbo_task_types?.name || '';
    const isKo = s => /^[가-힣]/.test(s), isEn = s => /^[A-Za-z]/.test(s);
    const rank = s => isKo(s) ? 0 : isEn(s) ? 1 : 2;
    if(rank(na) !== rank(nb)) return rank(na) - rank(nb);
    return na.localeCompare(nb, 'ko');
  });
  const avatarEl = document.getElementById('modal-avatar');
  const url = avatarUrl(m.user_id);
  avatarEl.innerHTML = url ? `<img src="${url}" alt="" onerror="this.parentElement.innerHTML='<span>🐱</span>'" style="width:100%;height:100%;object-fit:cover">` : '<span>🐱</span>';
  document.getElementById('modal-nick').textContent = m.nickname;
  document.getElementById('modal-uid').textContent = m.user_id ? `(${m.user_id})` : '';
  const listEl = document.getElementById('modal-task-list');
  listEl.innerHTML = tasks.map(t => {
    const isEvent = t.upbo_task_types?.category === 'event';
    const isPrep = !!t.is_prepared;
    const rowCls = `task-row${isEvent?' evt':''}${isPrep?' prep':''}`;
    const tags = `${isEvent?'<span class="mini-tag evt">이벤트</span>':''}${isPrep?'<span class="mini-tag prep">✓ 준비</span>':''}`;
    return `<div class="${rowCls}">
      <div>
        <div class="task-name">${esc(t.upbo_task_types?.name||'')}${tags}</div>
        ${t.memo ? `<div class="task-memo-txt">${esc(t.memo)}</div>` : ''}
      </div>
      <span class="task-qty">×${t.quantity||1}</span>
    </div>`;
  }).join('');
  document.getElementById('upboModal').classList.add('open');
}

function closeUpboModal(e){ if(e.target===e.currentTarget){ document.getElementById('upboModal').classList.remove('open'); document.querySelector('#upboModal .modal-box').style.top = ''; } }
document.addEventListener('keydown', e => { if(e.key==='Escape'){ document.getElementById('upboModal').classList.remove('open'); document.getElementById('inquiryModal').classList.remove('open'); }});

function openInquiry(){
  document.getElementById('inquiryForm').style.display='block';
  document.getElementById('inquirySuccess').style.display='none';
  document.getElementById('iNick').value='';
  document.getElementById('iContent').value='';
  document.getElementById('inquiryModal').classList.add('open');
}
function closeInquiry(e){ if(e.target===e.currentTarget) document.getElementById('inquiryModal').classList.remove('open'); }
async function submitInquiry(){
  const nick = document.getElementById('iNick').value.trim();
  const content = document.getElementById('iContent').value.trim();
  if(!nick||!content) return;
  const { error } = await sb.from('upbo_inquiries').insert({ nickname:nick, content });
  if(error){ alert('접수 실패: '+error.message); return; }
  document.getElementById('inquiryForm').style.display='none';
  document.getElementById('inquirySuccess').style.display='block';
  setTimeout(() => document.getElementById('inquiryModal').classList.remove('open'), 2000);
}

if(new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
load();
</script>
</body>
</html>
