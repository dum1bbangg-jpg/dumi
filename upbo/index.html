<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>두미 · 업보</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#4a3a30; --paper:#fbf6ee; --grid:#ece1d0;
    --c-card:#f6ead0; --t-card:#ecd6a4; --accent:#ff8fb0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:'Gaegu',system-ui,sans-serif;color:var(--ink);
    background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px;-webkit-font-smoothing:antialiased;padding:0 14px 56px;line-height:1.45;
  }
  .diary{max-width:460px;margin:0 auto;}

  nav.tabs{display:flex;justify-content:center;gap:6px;padding:16px 0 6px;position:sticky;top:0;z-index:30;background:linear-gradient(var(--paper) 78%,transparent);}
  nav.tabs a{font-weight:700;font-size:1.08rem;text-decoration:none;color:var(--ink);padding:3px 16px 5px;border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:2px 2px 0 rgba(74,58,48,.16);transform:rotate(-1.5deg);transition:transform .15s;}
  nav.tabs a:nth-child(2){transform:rotate(1deg);}
  nav.tabs a:nth-child(3){transform:rotate(-.5deg);}
  nav.tabs a:hover{transform:translateY(-2px) rotate(0);}
  nav.tabs a.active{background:#c9ecd9;}

  .sketch{position:relative;}
  .sketch::before{content:'';position:absolute;inset:0;border:2.4px solid var(--ink);border-radius:18px;filter:url(#wob);pointer-events:none;z-index:3;}
  .sketch.w2::before{filter:url(#wob2);}
  .card{position:relative;border-radius:18px;padding:18px 20px;box-shadow:5px 6px 0 rgba(74,58,48,.13);background:var(--c-card);margin-bottom:30px;}
  .card > *{position:relative;z-index:2;}
  .tab{position:absolute;top:-17px;left:18px;padding:1px 16px 3px;border-radius:13px;font-weight:700;font-size:1.18rem;background:var(--t-card);box-shadow:3px 3px 0 rgba(74,58,48,.13);transform:rotate(-2deg);z-index:5;}

  header.hero{margin:6px 2px 26px;}
  .hero .title{font-weight:700;font-size:2.5rem;line-height:1;margin:0;}
  .hero .sub{font-size:1.15rem;opacity:.6;margin-top:4px;}

  /* 필터 */
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 22px;}
  .filters button{font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;padding:2px 13px 4px;border:2px solid var(--ink);border-radius:13px;background:#fff;color:var(--ink);transition:transform .12s;}
  .filters button:hover{transform:translateY(-1px);}
  .filters button.on{background:var(--accent);color:#fff;}

  /* 업보 항목 */
  .ach-row{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;border-bottom:2px dashed #4a3a3030;}
  .ach-row:last-child{border-bottom:none;}
  .ach-date{font-weight:700;min-width:46px;font-size:1.02rem;opacity:.75;flex-shrink:0;}
  .ach-content{font-size:1.12rem;flex:1;}
  .ach-mark{display:inline-block;padding:0 4px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  .ach-cat{display:inline-block;font-size:.78rem;font-weight:700;color:#fff;padding:1px 8px;border-radius:9px;margin-left:6px;vertical-align:middle;}

  .empty{text-align:center;padding:40px 0;opacity:.6;font-size:1.15rem;}
  .loading{text-align:center;padding:40px 0;opacity:.5;font-size:1.1rem;}

  footer{margin:40px 4px 0;text-align:center;font-size:1rem;opacity:.55;}

  body.embed nav.tabs{display:none;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="wob2"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<main class="diary">

  <nav class="tabs">
    <a href="/">프로필</a>
    <a href="/upbo/" class="active">업보</a>
    <a href="/song/">노래책</a>
  </nav>

  <header class="hero">
    <h1 class="title">업보책 📖</h1>
    <div class="sub">두미가 쌓아온 발자취</div>
  </header>

  <div class="filters" id="catFilters"></div>

  <div id="achWrap">
    <div class="loading">불러오는 중...</div>
  </div>

  <footer>
    <p>© 2026 두미 · 두콩이들 💗</p>
    <p>Designed &amp; Developed by 아키텍트 크리에이티브 · profile@soop.info</p>
  </footer>
</main>

<script src="../js/supabase-config.js"></script>
<script>
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');

  const sb = initSupabase();
  let cats = [];
  let achs = [];
  let catFilter = 'all';

  async function load() {
    const [{ data: c }, { data: a }] = await Promise.all([
      sb.from('achievement_categories').select('*').order('sort_order'),
      sb.from('achievements').select('*, achievement_categories(name,color)').order('year', { ascending:false }).order('sort_order').order('date_label')
    ]);
    cats = c || [];
    achs = a || [];
    renderFilters();
    render();
  }

  function renderFilters() {
    const el = document.getElementById('catFilters');
    let html = `<button class="${catFilter==='all'?'on':''}" onclick="setFilter('all',this)">전체</button>`;
    html += cats.map(cat =>
      `<button class="${String(catFilter)===String(cat.id)?'on':''}" style="${String(catFilter)===String(cat.id)?`background:${cat.color};border-color:${cat.color}`:''}" onclick="setFilter('${cat.id}',this)">${cat.name}</button>`
    ).join('');
    el.innerHTML = html;
  }

  function setFilter(id, btn) {
    catFilter = id;
    renderFilters();
    render();
  }

  function render() {
    const wrap = document.getElementById('achWrap');
    const list = catFilter === 'all' ? achs : achs.filter(a => String(a.category_id) === String(catFilter));
    if (!list.length) { wrap.innerHTML = '<div class="empty">아직 기록된 업보가 없어요 🌱</div>'; return; }

    // 연도별 그룹
    const byYear = {};
    list.forEach(a => { const y = a.year || '기타'; (byYear[y] = byYear[y] || []).push(a); });
    const years = Object.keys(byYear).sort((x, y) => (y === '기타' ? -1 : x === '기타' ? 1 : y - x));

    wrap.innerHTML = years.map(y => `
      <section class="card sketch w2">
        <span class="tab">${y}${y==='기타'?'':'년'}</span>
        ${byYear[y].map(a => {
          const cat = a.achievement_categories;
          const color = cat ? cat.color : '#ecd6a4';
          return `<div class="ach-row">
            <div class="ach-date">${a.date_label || ''}</div>
            <div class="ach-content"><span class="ach-mark" style="background:${color}55">${a.content}</span>${cat ? `<span class="ach-cat" style="background:${color}">${cat.name}</span>` : ''}</div>
          </div>`;
        }).join('')}
      </section>`).join('');
  }

  load();
</script>
</body>
</html>
